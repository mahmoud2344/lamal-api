name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly early warning that an upstream federal file changed shape.
    # New premium years are published in late September.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check src tests
      - name: ruff format
        run: ruff format --check src tests
      - name: mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # The suite is fully offline: it runs against small fixtures carved out
      # of the real federal files, so CI never depends on admin.ch being up.
      - name: pytest
        run: pytest -m "not network" --cov=lamal_api --cov-report=term-missing

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: lamal-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container starts and serves /health
        run: |
          docker run -d --name lamal -p 8000:8000 \
            -e DATABASE_URL=sqlite:////data/lamal.db lamal-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then
              echo "healthy after ${i}s:"; cat /tmp/health.json; exit 0
            fi
            sleep 1
          done
          echo "health check never succeeded; container logs:"
          docker logs lamal
          exit 1
      - name: CLI is wired up
        run: docker run --rm lamal-api:ci --version
      - name: Stop container
        if: always()
        run: docker rm -f lamal || true

  sync-smoke:
    # Hits the real federal servers, so it runs on a schedule and on demand
    # rather than on every PR — it is an early warning that an upstream file
    # changed shape, not a gate on contributions.
    name: Live sync against admin.ch
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: lamal-api sync
        run: lamal-api sync
        env:
          DATABASE_URL: sqlite:///./data/ci.db
      - name: Sanity-check the loaded data
        run: |
          lamal-api info
          python - <<'PY'
          from sqlalchemy import func, select
          from lamal_api.config import Settings
          from lamal_api.db import models
          from lamal_api.db.engine import create_db_engine

          engine = create_db_engine(Settings(database_url="sqlite:///./data/ci.db"))
          with engine.connect() as conn:
              rows = conn.execute(select(func.count()).select_from(models.premium)).scalar()
              communes = conn.execute(select(func.count()).select_from(models.commune)).scalar()
          print(f"{rows:,} premium rows, {communes:,} communes")
          assert rows and rows > 100_000, f"suspiciously few premium rows: {rows}"
          assert communes and communes > 1_000, f"suspiciously few communes: {communes}"
          PY
